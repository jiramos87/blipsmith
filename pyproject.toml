[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.12",
  "cmake>=3.20",
  "ninja>=1.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "blipsmith"
version = "0.1.0"
description = "An agent-playable lo-fi synthesizer: deterministic C++ DSP core, MCP and CLI surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Javier Ramos", email = "jiramos87@gmail.com" }]
keywords = ["audio", "synthesizer", "dsp", "mcp", "game-audio", "deterministic"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
  "mcp>=1.28.1",
  "pydantic>=2.7",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
blipsmith = "blipsmith.cli:main"
blipsmith-mcp = "blipsmith.mcp_server:main"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/blipsmith"]
cmake.version = ">=3.20"
cmake.build-type = "Release"

[tool.cibuildwheel]
# CI builds wheels for the two platforms the determinism gate covers, and no
# others: a wheel this project has never proven bit-identical on is a wheel it
# should not be handing out.
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 pp*"
# The one failure a wheel can have that a source build cannot: shipping without
# its compiled core. `import blipsmith` fails fast by design, so this catches it.
test-command = "python -c \"import blipsmith; print(blipsmith._core.ping())\""

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests", "scripts"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
